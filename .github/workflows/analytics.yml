# The analytics worker in the cloud: DuckDB reads the event log from Supabase, computes Trust
# Scores, the funnel and retention, and writes them back. Every 6 hours, at 17 minutes past (under load
# GitHub may start a run late). Rarely on purpose: GitHub bills every run as at least one minute,
# so every 5 minutes would cost about 8,600 minutes a month, and this costs about 120. Run it by
# hand (Actions, Analytics worker, Run workflow) for a fresh score now.
#
# It connects as pinkilock_analytics, a role that can read events, invites and profiles and write
# only trust_scores and analytics.* (see the first migration). It holds no other credential.
#
# One run per project that is set up; a project with missing values is skipped, not failed:
#   preview      secret ANALYTICS_DB_PASSWORD, variables SUPABASE_PROJECT_REF, SUPABASE_POOLER_HOST
#   production   secret PROD_ANALYTICS_DB_PASSWORD, variables PROD_SUPABASE_PROJECT_REF,
#                PROD_SUPABASE_POOLER_HOST
# The Supabase deploy workflow sets each role's password from the same secret and prints the
# pooler host (the direct database host is IPv6-only; GitHub runners are not).
#
# A failed run is not silent: it opens (or adds to) an issue labelled analytics-worker (one per
# project), and GitHub emails the failure. The next good run closes the issue.
name: Analytics worker

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

# One at a time. A run that is still going makes the next one wait rather than overlap.
concurrency:
  group: analytics-worker
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        target: [preview, production]
    env:
      TARGET: ${{ matrix.target }}
      # Both projects' values come in and each step picks its own: an empty production value
      # never falls back to a preview one.
      PREVIEW_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      PREVIEW_POOLER: ${{ vars.SUPABASE_POOLER_HOST }}
      PROD_REF: ${{ vars.PROD_SUPABASE_PROJECT_REF }}
      PROD_POOLER: ${{ vars.PROD_SUPABASE_POOLER_HOST }}
      LABEL: ${{ matrix.target == 'production' && 'analytics-worker-production' || 'analytics-worker' }}
    steps:
      # Nothing to do until the project's values exist (a fresh fork, before go-live, or no
      # production project yet). The matrix context is not available to a job-level `if`.
      - name: Is ${{ matrix.target }} set up?
        id: ready
        run: |
          if [ "$TARGET" = production ]; then REF="$PROD_REF" POOLER_HOST="$PROD_POOLER"; else REF="$PREVIEW_REF" POOLER_HOST="$PREVIEW_POOLER"; fi
          if [ -n "$REF" ] && [ -n "$POOLER_HOST" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; else echo "Skipping $TARGET: no project or pooler host yet."; fi
      - uses: actions/checkout@v4
        if: steps.ready.outputs.go == 'true'
      - uses: actions/setup-python@v5
        if: steps.ready.outputs.go == 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: analytics/requirements.txt
      - run: pip install -r analytics/requirements.txt
        if: steps.ready.outputs.go == 'true'
      - name: Run the pipeline
        if: steps.ready.outputs.go == 'true'
        # `shell: bash` turns on pipefail, so a failing pipeline fails the step despite the tee.
        shell: bash
        env:
          PREVIEW_PASSWORD: ${{ secrets.ANALYTICS_DB_PASSWORD }}
          PROD_PASSWORD: ${{ secrets.PROD_ANALYTICS_DB_PASSWORD }}
        run: |
          if [ "$TARGET" = production ]; then
            ANALYTICS_DB_PASSWORD="$PROD_PASSWORD" REF="$PROD_REF" POOLER_HOST="$PROD_POOLER"
          else
            ANALYTICS_DB_PASSWORD="$PREVIEW_PASSWORD" REF="$PREVIEW_REF" POOLER_HOST="$PREVIEW_POOLER"
          fi
          export ANALYTICS_DB_PASSWORD REF POOLER_HOST
          if [ -z "$ANALYTICS_DB_PASSWORD" ]; then
            name=ANALYTICS_DB_PASSWORD; [ "$TARGET" = production ] && name=PROD_ANALYTICS_DB_PASSWORD
            echo "::error::$name is not set"; exit 1
          fi
          # The DSN is put together here and lives only in this step's environment.
          PINKILOCK_PG_DSN="$(python3 -c 'import os, urllib.parse as u; print("postgresql://pinkilock_analytics.%s:%s@%s:5432/postgres?sslmode=require" % (os.environ["REF"], u.quote(os.environ["ANALYTICS_DB_PASSWORD"], safe=""), os.environ["POOLER_HOST"]))')"
          export PINKILOCK_PG_DSN
          python analytics/duckdb_pipeline.py 2>&1 | tee run.log
          {
            echo "### Analytics worker: $TARGET"
            grep -E '^(read|wrote) ' run.log | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Make a failure visible
        if: failure() && steps.ready.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create "$LABEL" --color B60205 --description "The analytics worker is failing ($TARGET)" --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
          open="$(gh issue list --repo "$GITHUB_REPOSITORY" --label "$LABEL" --state open --json number --jq '.[0].number')"
          if [ -n "$open" ]; then
            gh issue comment "$open" --repo "$GITHUB_REPOSITORY" --body "Failed again: $RUN_URL"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --label "$LABEL" \
              --title "Analytics worker is failing on $TARGET: trust scores are not being refreshed" \
              --body "The scheduled DuckDB pipeline failed for $TARGET. Trust badges keep showing the last scores it wrote until it runs again. First failing run: $RUN_URL. This issue closes itself on the next good run."
          fi

      - name: Close the failure issue after a good run
        if: success() && steps.ready.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for n in $(gh issue list --repo "$GITHUB_REPOSITORY" --label "$LABEL" --state open --json number --jq '.[].number' 2>/dev/null); do
            gh issue close "$n" --repo "$GITHUB_REPOSITORY" --comment "The worker is running again."
          done
