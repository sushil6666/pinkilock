# Sends supabase/ to a Supabase project: auth settings (set and read back), migrations (schema, RLS, cron, push), the
# push Edge Function and its shared secret, and then proves it with the two-user test. Nothing is
# set up by hand in the Supabase dashboard.
#
# Two targets:
#   preview      the project in SUPABASE_PROJECT_REF. Deployed on every push to main that touches
#                supabase/, and by hand. The installable preview APK talks to it.
#   production   the project in PROD_SUPABASE_PROJECT_REF. Only by hand (Run workflow, target
#                production), and refused until that variable exists, so nothing can reach a
#                production project before there is one. It runs in the `production` GitHub
#                environment, where required reviewers can be added (Settings, Environments).
#                The two-user test is not run there: it would put test people in real Discover.
#
# Needs, in the repository's Actions settings (secrets / variables):
#   preview      secrets SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD
#                variables SUPABASE_PROJECT_REF, EXPO_PUBLIC_SUPABASE_ANON_KEY (for the test)
#   production   secret PROD_SUPABASE_DB_PASSWORD; variable PROD_SUPABASE_PROJECT_REF
#                (SUPABASE_ACCESS_TOKEN is used unless PROD_SUPABASE_ACCESS_TOKEN is set)
#   optional     ANALYTICS_DB_PASSWORD / PROD_ANALYTICS_DB_PASSWORD (the analytics worker's login)
#                EXPO_ACCESS_TOKEN (Expo push with enhanced security)
#                TWILIO_VERIFY_ACCOUNT_SID, TWILIO_VERIFY_AUTH_TOKEN, TWILIO_VERIFY_SERVICE_SID
#                (phone sign-in; until all three exist the phone provider is left off)
#                SMTP_PASSWORD secret, SMTP_HOST, SMTP_USER, SMTP_SENDER_EMAIL and optionally
#                SMTP_PORT variables (email sign-in codes; until they exist email sign-in is off,
#                because Supabase's own mailer only reaches the project's team). Set them as
#                environment secrets and variables to give production a sender of its own.
name: Supabase deploy

on:
  push:
    branches: [main]
    paths: ['supabase/**', '.github/workflows/supabase-deploy.yml']
  workflow_dispatch:
    inputs:
      target:
        description: Which project
        type: choice
        options: [preview, production]
        default: preview

concurrency:
  group: supabase-deploy-${{ inputs.target || 'preview' }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.target == 'production' && 'production' || 'preview' }}
    env:
      TARGET: ${{ inputs.target || 'preview' }}
      # This workflow is the confirmation: running it means "apply supabase/ to the project".
      SUPABASE_YES: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Pick the project
        # Both targets' values come in; only the chosen one is passed on. Production is refused
        # outright until PROD_SUPABASE_PROJECT_REF exists: there is no fallback to preview values.
        env:
          PREVIEW_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          PREVIEW_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PREVIEW_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PREVIEW_ANALYTICS_PASSWORD: ${{ secrets.ANALYTICS_DB_PASSWORD }}
          PROD_REF: ${{ vars.PROD_SUPABASE_PROJECT_REF }}
          PROD_TOKEN: ${{ secrets.PROD_SUPABASE_ACCESS_TOKEN || secrets.SUPABASE_ACCESS_TOKEN }}
          PROD_DB_PASSWORD: ${{ secrets.PROD_SUPABASE_DB_PASSWORD }}
          PROD_ANALYTICS_PASSWORD: ${{ secrets.PROD_ANALYTICS_DB_PASSWORD }}
        run: |
          case "$TARGET" in
            preview)    p=PREVIEW; names="SUPABASE_PROJECT_REF SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD" ;;
            production) p=PROD; names="PROD_SUPABASE_PROJECT_REF SUPABASE_ACCESS_TOKEN PROD_SUPABASE_DB_PASSWORD" ;;
            *) echo "::error::Unknown target $TARGET"; exit 1 ;;
          esac
          ref="${p}_REF" token="${p}_TOKEN" pw="${p}_DB_PASSWORD" apw="${p}_ANALYTICS_PASSWORD"
          missing=0
          set -- $names
          for v in "$ref" "$token" "$pw"; do
            if [ -z "${!v}" ]; then echo "::error::$1 is not set (Settings, Secrets and variables, Actions), so nothing is deployed to $TARGET"; missing=1; fi
            shift
          done
          [ "$missing" = 0 ] || exit 1
          if [ "$TARGET" = production ] && [ "${!ref}" = "$PREVIEW_REF" ]; then
            echo "::error::PROD_SUPABASE_PROJECT_REF is the preview project. Production needs a project of its own."; exit 1
          fi
          {
            echo "SUPABASE_PROJECT_REF=${!ref}"
            echo "SUPABASE_ACCESS_TOKEN=${!token}"
            echo "SUPABASE_DB_PASSWORD=${!pw}"
            echo "ANALYTICS_DB_PASSWORD=${!apw}"
          } >> "$GITHUB_ENV"
          echo "Deploying to $TARGET: ${!ref}"
          echo "### Supabase deploy: $TARGET (\`${!ref}\`)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Link the project
        run: npx supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: Auth settings that the app's safety depends on
        # Set through the Management API so that they are code, not dashboard state, and read
        # back into the run summary. Only these keys are touched. The list and the reasons are in
        # OPERATIONS.md ("Auth settings"); the local stack's copies are in supabase/config.toml.
        run: |
          cat > "$RUNNER_TEMP/auth.json" <<'JSON'
          {
            "external_anonymous_users_enabled": true,
            "disable_signup": false,
            "rate_limit_anonymous_users": 30,
            "rate_limit_otp": 30,
            "rate_limit_verify": 30,
            "rate_limit_token_refresh": 150,
            "jwt_exp": 3600,
            "refresh_token_rotation_enabled": true,
            "security_refresh_token_reuse_interval": 10,
            "mailer_otp_exp": 600
          }
          JSON
          curl -fsS -X PATCH "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
            --data @"$RUNNER_TEMP/auth.json" -o /dev/null
          {
            echo "#### Auth settings now in force"
            echo '```'
            curl -fsS "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/config/auth" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              | jq '{external_anonymous_users_enabled, disable_signup, rate_limit_anonymous_users, rate_limit_otp, rate_limit_verify,
                     rate_limit_token_refresh, jwt_exp, refresh_token_rotation_enabled, security_refresh_token_reuse_interval,
                     mailer_otp_exp, security_captcha_enabled, external_email_enabled, external_phone_enabled}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Apply migrations
        run: npx supabase db push --remote --include-all
      - name: Show what is applied
        run: npx supabase migration list --remote
      - name: Supabase's own security checks
        # Report only: what the project's security advisor says after the migrations. It does
        # not fail the deploy yet; read the run summary, fix what it lists in a migration.
        run: |
          if out="$(curl -fsS "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/advisors/security" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN")"; then
            {
              echo "#### Security advisor"
              echo "$out" | jq -r '(.lints // []) | if length == 0 then "Nothing flagged." else .[] | "- \(.level): \(.title) (\(.name))" end'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "$out" | jq -r '(.lints // [])[] | select(.level == "ERROR") | "::warning::Security advisor: \(.title) (\(.name))"'
          else
            echo "::warning::The security advisor could not be read; nothing was checked."
          fi
      - name: Let the analytics worker log in
        # Sets the pinkilock_analytics password from the same secret the worker uses. Its
        # rights come from the migrations and are not changed here.
        run: |
          if [ -n "$ANALYTICS_DB_PASSWORD" ]; then
            scripts/analytics-role.sh "$(scripts/supabase-db-url.sh postgres "$SUPABASE_DB_PASSWORD")"
          else
            name=ANALYTICS_DB_PASSWORD; [ "$TARGET" = production ] && name=PROD_ANALYTICS_DB_PASSWORD
            echo "::warning::$name is not set (or is empty), so the analytics worker cannot log in to $TARGET yet"
          fi
      - name: Say where the session pooler is
        # Not a secret. The analytics workflow needs it as a variable.
        run: |
          host="$(scripts/supabase-db-url.sh postgres x | python3 -c 'import sys, urllib.parse as u; print(u.urlsplit(sys.stdin.read().strip()).hostname)')"
          name=SUPABASE_POOLER_HOST; [ "$TARGET" = production ] && name=PROD_SUPABASE_POOLER_HOST
          echo "Session pooler host: $host"
          echo "Set the repository variable \`$name\` to \`$host\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Deploy the push function
        run: npx supabase functions deploy push --use-api --no-verify-jwt
      - name: Deploy the line review function
        run: npx supabase functions deploy review-line --use-api --no-verify-jwt
      - name: Deploy the contact proof function
        run: npx supabase functions deploy contact-verify --use-api --no-verify-jwt
      - name: Deploy the photo function
        run: npx supabase functions deploy photo --use-api --no-verify-jwt
      - name: Deploy the sign-in code function
        run: npx supabase functions deploy auth-code --use-api --no-verify-jwt
      - name: Deploy the wallet function
        run: npx supabase functions deploy wallet --use-api --no-verify-jwt
      - name: Wallet top-ups (Razorpay), once the keys exist
        # D104. Off until RAZORPAY_KEY_ID and RAZORPAY_KEY_SECRET are secrets: the app then says
        # top-ups are not open yet, and rewards and spending still work. Test keys (rzp_test_...)
        # move no money. Production may have its own keys: PROD_RAZORPAY_KEY_ID and so on.
        # OPERATIONS.md, "Wallet", has the steps.
        env:
          KEY_ID: ${{ (env.TARGET == 'production' && secrets.PROD_RAZORPAY_KEY_ID) || secrets.RAZORPAY_KEY_ID }}
          KEY_SECRET: ${{ (env.TARGET == 'production' && secrets.PROD_RAZORPAY_KEY_SECRET) || secrets.RAZORPAY_KEY_SECRET }}
          WEBHOOK_SECRET: ${{ (env.TARGET == 'production' && secrets.PROD_RAZORPAY_WEBHOOK_SECRET) || secrets.RAZORPAY_WEBHOOK_SECRET }}
        run: |
          if [ -n "$KEY_ID" ] && [ -n "$KEY_SECRET" ]; then
            args=("RAZORPAY_KEY_ID=$KEY_ID" "RAZORPAY_KEY_SECRET=$KEY_SECRET")
            [ -n "$WEBHOOK_SECRET" ] && args+=("RAZORPAY_WEBHOOK_SECRET=$WEBHOOK_SECRET")
            npx supabase secrets set "${args[@]}" >/dev/null
            case "$KEY_ID" in rzp_test_*) mode="on, test mode (no real money)";; *) mode="on, live";; esac
          else
            npx supabase secrets unset RAZORPAY_KEY_ID RAZORPAY_KEY_SECRET RAZORPAY_WEBHOOK_SECRET >/dev/null 2>&1 || true
            mode="off (add RAZORPAY_KEY_ID and RAZORPAY_KEY_SECRET)"
            echo "::notice::RAZORPAY_KEY_ID and RAZORPAY_KEY_SECRET are not set, so wallet top-ups stay off"
          fi
          echo "- Wallet top-ups: $mode${WEBHOOK_SECRET:+, webhook on}" >> "$GITHUB_STEP_SUMMARY"
      - name: Deploy the talk function
        run: npx supabase functions deploy talk --use-api --no-verify-jwt
      - name: Talk mode switches (voice, listener payouts), once the keys exist
        # D108. The AI companion uses ANTHROPIC_API_KEY (set by the line review step below). Voice
        # calls need LiveKit; listener sign-up and payouts need Razorpay Route turned on for the
        # Razorpay account (TALK_ROUTE = on). Each stays off until set. OPERATIONS.md, "Talk mode".
        env:
          LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
          TALK_ROUTE: ${{ secrets.TALK_ROUTE }}
          TALK_MODEL: ${{ vars.TALK_MODEL }}
          TALK_ROUTE_CATEGORY: ${{ vars.TALK_ROUTE_CATEGORY }}
          TALK_ROUTE_SUBCATEGORY: ${{ vars.TALK_ROUTE_SUBCATEGORY }}
        run: |
          voice=off; route=off; args=()
          if [ -n "$LIVEKIT_URL" ] && [ -n "$LIVEKIT_API_KEY" ] && [ -n "$LIVEKIT_API_SECRET" ]; then
            args+=("LIVEKIT_URL=$LIVEKIT_URL" "LIVEKIT_API_KEY=$LIVEKIT_API_KEY" "LIVEKIT_API_SECRET=$LIVEKIT_API_SECRET"); voice=on
          else
            npx supabase secrets unset LIVEKIT_URL LIVEKIT_API_KEY LIVEKIT_API_SECRET >/dev/null 2>&1 || true
          fi
          if [ "$TALK_ROUTE" = on ]; then args+=("TALK_ROUTE=on"); route=on; else npx supabase secrets unset TALK_ROUTE >/dev/null 2>&1 || true; fi
          [ -n "$TALK_MODEL" ] && args+=("TALK_MODEL=$TALK_MODEL")
          [ -n "$TALK_ROUTE_CATEGORY" ] && args+=("TALK_ROUTE_CATEGORY=$TALK_ROUTE_CATEGORY")
          [ -n "$TALK_ROUTE_SUBCATEGORY" ] && args+=("TALK_ROUTE_SUBCATEGORY=$TALK_ROUTE_SUBCATEGORY")
          [ ${#args[@]} -gt 0 ] && npx supabase secrets set "${args[@]}" >/dev/null
          echo "- Talk mode: voice $voice, listener payouts $route (also needs the Razorpay keys)" >> "$GITHUB_STEP_SUMMARY"
      - name: Captcha on sign-in (production, once Turnstile is set up)
        # Gap G22, D091. On only for production and only when both the secret and the site key
        # exist: the site key goes into the app and website builds, and Auth must never ask for a
        # token no app can give. Preview stays off, so the live test can run against it. Turn it on
        # only after the phone build with the check is out: an older build cannot sign in once it
        # is on (OPERATIONS.md, "Captcha").
        env:
          SECRET: ${{ secrets.PROD_TURNSTILE_SECRET }}
          SITE_KEY: ${{ vars.PROD_TURNSTILE_SITE_KEY }}
        run: |
          if [ "$TARGET" = production ] && [ -n "$SECRET" ] && [ -n "$SITE_KEY" ]; then
            python3 -c 'import json, os; print(json.dumps({"security_captcha_enabled": True, "security_captcha_provider": "turnstile", "security_captcha_secret": os.environ["SECRET"]}))' > "$RUNNER_TEMP/captcha.json"
            npx supabase secrets set "TURNSTILE_SECRET=$SECRET" >/dev/null
            summary="on (Turnstile)"
          else
            echo '{"security_captcha_enabled": false}' > "$RUNNER_TEMP/captcha.json"
            npx supabase secrets unset TURNSTILE_SECRET >/dev/null 2>&1 || true
            summary="off"
          fi
          curl -fsS -X PATCH "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
            --data @"$RUNNER_TEMP/captcha.json" -o /dev/null
          rm -f "$RUNNER_TEMP/captcha.json"
          echo "- Captcha on sign-in: $summary" >> "$GITHUB_STEP_SUMMARY"
      - name: Contact proofs (WhatsApp, Instagram), once Meta is set up
        # Off until META_APP_SECRET and META_VERIFY_TOKEN are secrets. Where codes go comes from the
        # repository variables PINKILOCK_WHATSAPP_NUMBER (digits, with 91) and PINKILOCK_INSTAGRAM
        # (the account's username); a missing one leaves that app off. OPERATIONS.md has the steps.
        env:
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          META_VERIFY_TOKEN: ${{ secrets.META_VERIFY_TOKEN }}
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
          WA_NUMBER: ${{ vars.PINKILOCK_WHATSAPP_NUMBER }}
          IG_ACCOUNT: ${{ vars.PINKILOCK_INSTAGRAM }}
        run: |
          db="$(scripts/supabase-db-url.sh postgres "$SUPABASE_DB_PASSWORD")"
          wa=""; ig=""
          if [ -n "$META_APP_SECRET" ] && [ -n "$META_VERIFY_TOKEN" ]; then
            args=("META_APP_SECRET=$META_APP_SECRET" "META_VERIFY_TOKEN=$META_VERIFY_TOKEN")
            [ -n "$WHATSAPP_TOKEN" ] && args+=("WHATSAPP_TOKEN=$WHATSAPP_TOKEN")
            [ -n "$INSTAGRAM_TOKEN" ] && args+=("INSTAGRAM_TOKEN=$INSTAGRAM_TOKEN")
            npx supabase secrets set "${args[@]}" >/dev/null
            wa="$(printf '%s' "$WA_NUMBER" | tr -cd '0-9')"
            [ -n "$INSTAGRAM_TOKEN" ] && ig="$(printf '%s' "$IG_ACCOUNT" | tr -d ' @')"
          else
            echo "::notice::META_APP_SECRET and META_VERIFY_TOKEN are not set, so contact proofs stay off"
          fi
          printf '%s\n' "select private.set_config('verify_whatsapp', :'wa');" "select private.set_config('verify_instagram', :'ig');" \
            | psql "$db" -v ON_ERROR_STOP=1 -qAt -v wa="$wa" -v ig="$ig" >/dev/null
          echo "- Contact proofs: WhatsApp ${wa:+on}${wa:-off}, Instagram ${ig:+on}${ig:-off}" >> "$GITHUB_STEP_SUMMARY"
      - name: Line review, by AI once a Claude API key exists
        # 'ai' when ANTHROPIC_API_KEY is set (the review-line function asks Claude, a person decides
        # anything unsure); otherwise 'off' (the pattern check only, as before). A moderator can set
        # 'human' by hand: psql ... -c "select private.set_config('line_review', 'human')".
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          mode=off
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            npx supabase secrets set "ANTHROPIC_API_KEY=$ANTHROPIC_API_KEY" >/dev/null
            mode=ai
          fi
          echo "select private.set_config('line_review', :'m')" \
            | psql "$(scripts/supabase-db-url.sh postgres "$SUPABASE_DB_PASSWORD")" -v ON_ERROR_STOP=1 -qAt -v m="$mode" >/dev/null
          echo "- Profile line review: $mode" >> "$GITHUB_STEP_SUMMARY"
      - name: Connect Postgres to the push function
        # A fresh shared secret on every deploy, stored as a function secret and in Vault.
        run: scripts/push-config.sh remote "$(scripts/supabase-db-url.sh postgres "$SUPABASE_DB_PASSWORD")"
      - name: Pass on the Expo access token, if there is one
        # Only needed when "enhanced push security" is on for the Expo account.
        env:
          EXPO_ACCESS_TOKEN: ${{ secrets.EXPO_ACCESS_TOKEN }}
        run: |
          if [ -n "$EXPO_ACCESS_TOKEN" ]; then
            npx supabase secrets set "EXPO_ACCESS_TOKEN=$EXPO_ACCESS_TOKEN" >/dev/null
          fi
      - name: Phone sign-in (Twilio Verify), once its keys exist
        # Left off until all three secrets are set. Twilio Verify sends the codes from its own
        # registered templates, which is what India's DLT rules need for OTP texts.
        env:
          SID: ${{ secrets.TWILIO_VERIFY_ACCOUNT_SID }}
          TOKEN: ${{ secrets.TWILIO_VERIFY_AUTH_TOKEN }}
          SERVICE: ${{ secrets.TWILIO_VERIFY_SERVICE_SID }}
        run: |
          if [ -z "$SID" ] || [ -z "$TOKEN" ] || [ -z "$SERVICE" ]; then
            echo "Phone sign-in stays off: the TWILIO_VERIFY_* secrets are not all set."
            echo "- Phone sign-in: off (no SMS provider yet)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 -c 'import json, os; print(json.dumps({"external_phone_enabled": True, "sms_provider": "twilio_verify", "sms_autoconfirm": False,
            "sms_twilio_verify_account_sid": os.environ["SID"], "sms_twilio_verify_auth_token": os.environ["TOKEN"],
            "sms_twilio_verify_message_service_sid": os.environ["SERVICE"]}))' > "$RUNNER_TEMP/phone.json"
          curl -fsS -X PATCH "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
            --data @"$RUNNER_TEMP/phone.json" -o /dev/null
          rm -f "$RUNNER_TEMP/phone.json"
          echo "- Phone sign-in: on (Twilio Verify)" >> "$GITHUB_STEP_SUMMARY"
      - name: Email sign-in (your own mail sender), once its settings exist
        # Codes, not links: the templates in supabase/templates are the same ones the local stack
        # uses. Without a sender of our own it is switched off, since Supabase's built-in mailer
        # only delivers to the project's team and a few emails an hour.
        env:
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT || '465' }}
          SMTP_USER: ${{ vars.SMTP_USER }}
          SMTP_SENDER_EMAIL: ${{ vars.SMTP_SENDER_EMAIL }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          if [ -z "$SMTP_HOST" ] || [ -z "$SMTP_USER" ] || [ -z "$SMTP_SENDER_EMAIL" ] || [ -z "$SMTP_PASSWORD" ]; then
            body='{"external_email_enabled": false}'
            summary="off (no mail sender yet)"
          else
            body="$(python3 -c 'import json, os
          t = lambda n: open(f"supabase/templates/{n}.html").read()
          print(json.dumps({"external_email_enabled": True, "mailer_autoconfirm": False, "mailer_otp_length": 6,
            "smtp_host": os.environ["SMTP_HOST"], "smtp_port": os.environ["SMTP_PORT"], "smtp_user": os.environ["SMTP_USER"],
            "smtp_pass": os.environ["SMTP_PASSWORD"], "smtp_admin_email": os.environ["SMTP_SENDER_EMAIL"], "smtp_sender_name": "Pinkilock",
            "mailer_subjects_magic_link": "Your Pinkilock code", "mailer_templates_magic_link_content": t("magic_link"),
            "mailer_subjects_email_change": "Your Pinkilock code", "mailer_templates_email_change_content": t("email_change")}))')"
            summary="on ($SMTP_HOST)"
          fi
          printf '%s' "$body" > "$RUNNER_TEMP/email.json"
          curl -fsS -X PATCH "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
            --data @"$RUNNER_TEMP/email.json" -o /dev/null
          rm -f "$RUNNER_TEMP/email.json"
          echo "- Email sign-in: $summary" >> "$GITHUB_STEP_SUMMARY"
      - name: The link gate, on once a sign-in code can be sent
        # Asks and pinkies need a linked email or phone (docs/build-plan.md, WP2). With no mail
        # sender and no SMS provider nobody could link, so the gate stays off until one exists.
        env:
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          TWILIO_SID: ${{ secrets.TWILIO_VERIFY_ACCOUNT_SID }}
          TWILIO_SERVICE: ${{ secrets.TWILIO_VERIFY_SERVICE_SID }}
        run: |
          gate=off
          if { [ -n "$SMTP_HOST" ] && [ -n "$SMTP_PASSWORD" ]; } || { [ -n "$TWILIO_SID" ] && [ -n "$TWILIO_SERVICE" ]; }; then gate=on; fi
          scripts/gate-config.sh "$(scripts/supabase-db-url.sh postgres "$SUPABASE_DB_PASSWORD")" "$gate"
          echo "- Link gate (asks need an email or phone): $gate" >> "$GITHUB_STEP_SUMMARY"

  live-test:
    # Preview only: on production it would put test people in front of real ones.
    needs: deploy
    if: ${{ (inputs.target || 'preview') == 'preview' }}
    uses: ./.github/workflows/live-test.yml
    secrets: inherit
