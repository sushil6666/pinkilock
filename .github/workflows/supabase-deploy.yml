# Sends supabase/ to the real project: auth settings, migrations (schema, RLS, cron, push), the
# push Edge Function and its shared secret, and then proves it with the two-user test. Nothing is set up by hand in the Supabase dashboard.
#
# Needs, in the repository's Actions settings:
#   secrets    SUPABASE_ACCESS_TOKEN   personal access token (supabase.com/dashboard/account/tokens)
#              SUPABASE_DB_PASSWORD    the project's database password
#   variables  SUPABASE_PROJECT_REF    the project ref
#              EXPO_PUBLIC_SUPABASE_ANON_KEY   the anon (publishable) key, for the test that follows
#   optional   secret ANALYTICS_DB_PASSWORD (lets the analytics worker log in; see analytics.yml)
#              secret EXPO_ACCESS_TOKEN (Expo push with enhanced security)
name: Supabase deploy

on:
  push:
    # The second branch and the trigger path are TEMPORARY, removed before this branch merges:
    # they let the phase 2 branch deploy by touching .github/triggers/supabase-deploy.
    branches: [main, claude/project-thread-5n9g9n]
    paths: ['supabase/**', '.github/workflows/supabase-deploy.yml', '.github/triggers/supabase-deploy']
  workflow_dispatch:

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - name: Check that the project values are set
        run: |
          missing=0
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_REF; do
            if [ -z "${!name}" ]; then echo "::error::$name is not set (Settings, Secrets and variables, Actions)"; missing=1; fi
          done
          exit $missing
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Link the project
        run: npx supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: Turn on anonymous sign-ins
        # The one Auth setting the app depends on. Set through the Management API so that it is
        # code, and so that nothing else in the project's Auth config is touched.
        run: |
          curl -fsS -X PATCH "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
            -d '{"external_anonymous_users_enabled": true}' -o /dev/null
      - name: Apply migrations
        run: npx supabase db push --remote --include-all
      - name: Show what is applied
        run: npx supabase migration list --remote
      - name: Let the analytics worker log in
        # Sets the pinkilock_analytics password from the same secret the worker uses. Its
        # rights come from the migrations and are not changed here.
        env:
          ANALYTICS_DB_PASSWORD: ${{ secrets.ANALYTICS_DB_PASSWORD }}
        run: |
          if [ -n "$ANALYTICS_DB_PASSWORD" ]; then
            scripts/analytics-role.sh "$(scripts/supabase-db-url.sh postgres "$SUPABASE_DB_PASSWORD")"
          else
            echo "::warning::ANALYTICS_DB_PASSWORD is not set, so the analytics worker cannot log in yet"
          fi
      - name: Say where the session pooler is
        # Not a secret. The analytics workflow needs it as the SUPABASE_POOLER_HOST variable.
        run: |
          host="$(scripts/supabase-db-url.sh postgres x | python3 -c 'import sys, urllib.parse as u; print(u.urlsplit(sys.stdin.read().strip()).hostname)')"
          echo "Session pooler host: $host"
          echo "Set the repository variable \`SUPABASE_POOLER_HOST\` to \`$host\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Deploy the push function
        run: npx supabase functions deploy push --use-api --no-verify-jwt
      - name: Connect Postgres to the push function
        # A fresh shared secret on every deploy, stored as a function secret and in Vault.
        run: scripts/push-config.sh remote "$(scripts/supabase-db-url.sh postgres "$SUPABASE_DB_PASSWORD")"
      - name: Pass on the Expo access token, if there is one
        # Only needed when "enhanced push security" is on for the Expo account.
        env:
          EXPO_ACCESS_TOKEN: ${{ secrets.EXPO_ACCESS_TOKEN }}
        run: |
          if [ -n "$EXPO_ACCESS_TOKEN" ]; then
            npx supabase secrets set "EXPO_ACCESS_TOKEN=$EXPO_ACCESS_TOKEN" >/dev/null
          fi

  live-test:
    needs: deploy
    uses: ./.github/workflows/live-test.yml
    secrets: inherit
