# The two-user test against the real Supabase project: two anonymous users go through onboard,
# ask, lock, check in, reveal, bail and expiry, over the public API and Realtime, exactly as two
# phones would. Run it by hand (Actions, Live two-user test, Run workflow) or after a deploy.
# The two test users are deleted at the end.
name: Live two-user test

on:
  workflow_dispatch:
  workflow_call:

jobs:
  two-users:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      EXPO_PUBLIC_SUPABASE_URL: https://${{ vars.SUPABASE_PROJECT_REF }}.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check that the project values are set
        run: |
          missing=0
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_REF EXPO_PUBLIC_SUPABASE_ANON_KEY; do
            if [ -z "${!name}" ]; then echo "::error::$name is not set (Settings, Secrets and variables, Actions)"; missing=1; fi
          done
          exit $missing
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Link the project (for the clean-up connection)
        run: npx supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: A one-run pass through the network-country check
        # GitHub's runners are in the US, and only open countries may make a first profile (PL078).
        # The test sends this random token instead; it is cleared in the last step (D063).
        run: |
          token="$(openssl rand -hex 32)"
          echo "::add-mask::$token"
          echo "E2E_NETWORK_TOKEN=$token" >> "$GITHUB_ENV"
          echo "select private.set_config('network_check_token', :'t')" \
            | psql "$(scripts/supabase-db-url.sh postgres "$SUPABASE_DB_PASSWORD")" -v ON_ERROR_STOP=1 -qAt -v t="$token" >/dev/null
      - name: Two users, the whole flow
        run: |
          E2E_DB_URL="$(scripts/supabase-db-url.sh postgres "$SUPABASE_DB_PASSWORD")"
          export E2E_DB_URL
          npm run test:live
      - name: Clear the network-check token
        if: always()
        run: |
          echo "select private.set_config('network_check_token', '')" \
            | psql "$(scripts/supabase-db-url.sh postgres "$SUPABASE_DB_PASSWORD")" -v ON_ERROR_STOP=1 -qAt >/dev/null
