# On every pull request and every push to main: TypeScript strict and the unit tests, the database tests on a throwaway Postgres (the attacker
# suite included), a secret scan and a dependency audit, and the two-user, attacker, push and two-phone tests against a local
# Supabase stack. No project keys are used here.
#
# To save Actions minutes: a branch runs CI once it has a pull request, not on every push before
# that, and a change that touches only Markdown runs nothing.
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md']
  pull_request:
    paths-ignore: ['**/*.md']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Unit tests (error catalogue, logger, no silent failures)
        run: npm run test:unit

  security:
    # Nothing secret may be committed, and no new high or critical advisory may ship.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The whole history: a secret removed in a later commit is still leaked.
          fetch-depth: 0
      - name: Secret scan (gitleaks)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.18.4 detect --source /repo --redact --no-banner
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Dependency audit against the baseline
        run: npm run audit:check

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          # pgserver publishes no wheels for 3.13 yet.
          python-version: '3.12'
      - run: pip install pgserver -r analytics/requirements.txt
      - name: Migrations, RLS, promise functions, push outbox, DuckDB pipeline, attacker suite
        run: python tests/db/run.py

  local-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start Supabase locally
        run: npx supabase start -x studio,imgproxy,vector,logflare,storage-api,postgres-meta,supavisor
      - name: Point the push function at the fake Expo
        run: |
          EXPO_PUSH_URL=http://host.docker.internal:54399 scripts/push-config.sh local
          npx supabase stop
          npx supabase start -x studio,imgproxy,vector,logflare,storage-api,postgres-meta,supavisor
      - name: Lint the database functions
        # Report only for now: it has not had a first clean run. Once it has, change none to error.
        run: npx supabase db lint --schema public,private --level warning --fail-on none || echo "::warning::The database lint could not run."
      - name: Two users, Phase 3 and the attacker suite through the live API
        run: npm run test:live:local
      - name: Push, end to end
        run: npm run test:push:local
      - name: Two phones through the real screens
        run: |
          npx playwright install --with-deps chromium
          npm run test:app:local
      - name: Edge Function logs
        if: failure()
        run: docker logs supabase_edge_runtime_pinkilock 2>&1 | tail -100
      - name: Auth and mail logs
        # For the email sign-in test: what GoTrue sent, and what Mailpit received.
        if: failure()
        run: |
          docker logs supabase_auth_pinkilock 2>&1 | grep -iE 'mail|smtp|"/user"|otp|error' | tail -60
          docker logs supabase_inbucket_pinkilock 2>&1 | tail -30
