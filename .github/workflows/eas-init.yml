# One-off: creates the EAS project for this app under the account that owns EXPO_TOKEN and
# prints its id. The id is not a secret; it goes into app.json (expo.extra.eas.projectId) so
# that builds and push tokens know which project they belong to.
name: EAS init

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  init:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check the Expo token
        run: if [ -z "$EXPO_TOKEN" ]; then echo "::error::EXPO_TOKEN is not set (Settings, Secrets and variables, Actions)"; exit 1; fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install --global eas-cli@latest
      - name: Create or find the project
        run: |
          eas whoami
          eas init --force --non-interactive
          id="$(node -e 'console.log(require("./app.json").expo.extra?.eas?.projectId ?? "")')"
          owner="$(node -e 'console.log(require("./app.json").expo.owner ?? "")')"
          if [ -z "$id" ]; then id="$(eas project:info --json 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).id)}catch{console.log("")}})')"; fi
          if [ -z "$id" ]; then echo "::error::eas init did not report a project id"; exit 1; fi
          echo "EAS project id: $id  owner: ${owner:-$(eas whoami | head -1)}"
          echo "EAS project id: \`$id\`" >> "$GITHUB_STEP_SUMMARY"
